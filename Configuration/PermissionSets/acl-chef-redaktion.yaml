imports:
  - {resource: "acl-redaktion.yaml"}

label: "[GSB][ACL] Chef Redaktion"

modules:
  dashboard: "*"
  web_layout: true
  web_ViewpageView: true
  web_list: true
  web_form: true
  workspaces_admin: true
  file: "*"
  user_setup: true
  system_BelogLog: true
  site_redirects: true

resources:
  sys_category:
    permissions: ['read', 'write']
    fields: '*'
  sys_file:
    permissions: ['read', 'write']
    fields: '*'
