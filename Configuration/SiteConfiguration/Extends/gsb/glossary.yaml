routeEnhancers:
  DpnGlossary:
    type: Extbase
    extension: DpnGlossary
    plugin: glossary
    routes:
      - routePath: '/{character}'
        _controller: 'Term::list'
        _arguments:
          character: currentCharacter
    defaultController: 'Term::list'
    defaults:
      character: ''
    aspects:
      character:
        type: StaticMultiRangeMapper
        ranges:
          - start: 'A'
            end: 'Z'
            special: [ Ä,Ö,Ü ]
          - start: 'a'
            end: 'z'
            special: [ ä,ö,ü ]
