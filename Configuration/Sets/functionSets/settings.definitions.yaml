settings:


### Navigation Einstellungen ###
  
  
  navigation.gsb-navType:
    type: string
    default: '0'
    category: GSB.functions.navigation
    label: 'Hauptnavigation'
    enum:
      '0': 'Klassische Desktop Navigation'
      '1': 'Burger Menü'
    description: 'Darstellungsart der Hauptnavigation für die Desktop Ansicht auswählen.'
  navigation.categories-page:
    label: 'Kategorie Ablageort'
    category: GSB.functions.navigation
    description: 'Seiten-ID für das Speichern der Kategorien festlegen, oder über den Button "Select Page" auswählen.'
    type: page
    default: 150
  navigation.header-title:
    label: 'Title Attribut'
    category: GSB.functions.navigation
    description: 'Der Header Title wird in das Title Attribut in den Quellcode der Seite geschrieben'
    type: string
    default: 'ITZBund'
  navigation.home-page:
    label: 'Startseite'
    category: GSB.functions.navigation
    description: 'Seiten-ID für den Link zur Startseite festlegen, oder über den Button "Select Page" auswählen.'
    type: page
    default: 1
  navigation.meta-page:
    label: 'Meta Menü'
    category: GSB.functions.navigation
    description: 'Seiten-ID für die meta-elternseite der Meta-Navigation festlegen, oder über den Button "Select Page" auswählen. Hinweis: die unterseiten der ausgewählten meta-elternseite werden als Meta-Navigation angezeigt.'
    type: page
    default: 66
  navigation.metaTop-page:
    label: 'MetaTop Seite'
    category: GSB.functions.navigation
    description: 'MetaTop Seite'
    type: page
    default: 66
  navigation.footer-page:
    label: 'Footer Seite'
    category: GSB.functions.navigation
    description: 'Footer Seite'
    type: page
    default: 25


### Social Media Links Einstellungen ###
  socialMediaLinks.x:
    label: 'X'
    category: GSB.functions.socialMediaLinks
    type: string
    default: 'x.com'
  socialMediaLinks.facebook:
    label: 'Facebook'
    category: GSB.functions.socialMediaLinks
    type: string
    default: 'facebook.com'
  socialMediaLinks.instagram:
    label: 'Instagram'
    category: GSB.functions.socialMediaLinks
    type: string
    default: 'instagram.com'
  socialMediaLinks.xing:
    label: 'Xing'
    category: GSB.functions.socialMediaLinks
    type: string
    default: 'xing.com'
  socialMediaLinks.linkedin:
    label: 'LinkedIn'
    category: GSB.functions.socialMediaLinks
    type: string
    default: 'linkedin.com'
  socialMediaLinks.youtube:
    label: 'YouTube'
    category: GSB.functions.socialMediaLinks
    type: string
    default: 'youtube.com'
# search
  search.seach-page:
    label: 'Suche Seite'
    category: GSB.functions.suche
    description: 'Seiten-ID für die Suchergebnis-Seite festlegen, oder über den Button "Select Page" auswählen'
    type: page
    default: 35
  search.googleSiteVerification:
    label: 'Google Site Verification Code'
    category: GSB.functions
    description: 'Im diesem Feld muss der von Google Search Console bereitgestellte Verifizierungscode eingetragen werden. Dies erlaubt die Bestätigung der Eigentümerschaft der Website.'
    type: string
    default: ''
