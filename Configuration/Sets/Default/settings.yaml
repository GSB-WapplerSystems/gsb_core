# Site Set Settings for felogin overrides
# These settings override the default settings from typo3/felogin

# Email settings override
styles.content.loginform.emailFrom: "noreply@gsb.bund.de"
styles.content.loginform.emailFromName: "GSB Bundesverwaltung"
styles.content.loginform.replyToEmail: "support@gsb.bund.de"

# Template paths override
styles.content.loginform.email.templateRootPath: "EXT:gsb_core/Resources/Extensions/felogin/Resources/Private/Email/Templates/"

# Security settings
styles.content.loginform.forgotLinkHashValidTime: 24
styles.content.loginform.newPasswordMinLength: 8
styles.content.loginform.exposeNonexistentUserInForgotPasswordDialog: false

# Feature settings
styles.content.loginform.showForgotPassword: true
styles.content.loginform.showPermaLogin: true
styles.content.loginform.showLogoutFormAfterLogin: false

# Redirect settings (can be adjusted according to requirements)
styles.content.loginform.redirectMode: "login,referer"
styles.content.loginform.redirectFirstMethod: true
