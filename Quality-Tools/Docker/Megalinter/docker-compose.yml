services:
  megalinter:
    image: registry.gsb-itzbund.de/gsb11/devops/images/megalinter:1.6.14@sha256:81f0796334cdf371a7520d3d57a3ae5aedbed7cfbc04b1faed5553e5fec316f5
    container_name: ${PROJECT_NAME}-megalinter-container
    volumes:
      - type: bind
        source: ./../../../
        target: /var/www/html
        consistency: cached
    environment:
      DEFAULT_WORKSPACE: /var/www/html
      REPORT_OUTPUT_FOLDER: ${REPORT_OUTPUT_FOLDER}
      GIT_DEPTH: 0
      TERM: xterm-256color
      TZ: Europe/Berlin
